[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-enterprise"
version = "0.1.0"
description = "JARVIS Enterprise — modular AI organization and orchestration system"
requires-python = ">=3.10,<3.15"
dependencies = [
    "agent-framework-core==1.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]
